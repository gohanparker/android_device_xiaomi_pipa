name: build-cleanram-apk

# Standalone APK build: no AOSP tree, no soong/kati analysis (which needs >24G RAM).
# The tile is public-API only (force-stop via reflection), so it compiles against
# the public SDK android.jar. Signed with the AOSP test platform key (matches
# ROMs built with test-keys) so it can run as a privileged system app.

on:
  workflow_dispatch:
  push:
    branches: ["16.0"]
    paths:
      - ".github/workflows/build-apk.yml"
      - ".github/keys/**"
      - "device/xiaomi/pipa/CleanRamTile/**"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (build-tools 36 + platform 36)
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d cmdtools
          mv cmdtools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
          "$SDKMAN" "platforms;android-36" "build-tools;36.0.0"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Build + sign CleanRamTile.apk
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AJ="$ANDROID_HOME/platforms/android-36/android.jar"
          SRC="device/xiaomi/pipa/CleanRamTile"
          W=/tmp/apk
          rm -rf "$W"; mkdir -p "$W/compiled" "$W/gen" "$W/classes"

          echo "--- aapt2 compile resources"
          "$BT/aapt2" compile --dir "$SRC/res" -o "$W/compiled/res.zip"

          echo "--- aapt2 link"
          "$BT/aapt2" link -o "$W/base.apk" -I "$AJ" \
            --manifest "$SRC/AndroidManifest.xml" --java "$W/gen" \
            --min-sdk-version 30 --target-sdk-version 36 \
            "$W/compiled/res.zip"

          echo "--- javac"
          mapfile -t JAVAS < <(find "$SRC/src" "$W/gen" -name '*.java')
          javac -source 8 -target 8 -nowarn -bootclasspath "$AJ" -classpath "$AJ" \
            -d "$W/classes" "${JAVAS[@]}"

          echo "--- d8 (dex + lambda desugaring)"
          mapfile -t CLASSES < <(find "$W/classes" -name '*.class')
          "$BT/d8" --lib "$AJ" --min-api 30 --output "$W" "${CLASSES[@]}"

          echo "--- package"
          cp "$W/base.apk" "$W/unsigned.apk"
          (cd "$W" && zip -q unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 "$W/unsigned.apk" "$W/aligned.apk"

          echo "--- sign with AOSP test platform key"
          "$BT/apksigner" sign \
            --key .github/keys/platform.pk8 \
            --cert .github/keys/platform.x509.pem \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out CleanRamTile.apk "$W/aligned.apk"
          "$BT/apksigner" verify --print-certs CleanRamTile.apk | head -n 6
          ls -la CleanRamTile.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRamTile-apk
          path: CleanRamTile.apk
          if-no-files-found: error
