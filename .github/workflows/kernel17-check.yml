name: kernel17-check

# Validates the Android 17 (lineage-24.0) pipa kernel port:
#   base = vendor/xiaomi/sm8250-common.config  (lineage-24.0 sm8250-common)
#   frag = vendor/xiaomi/pipa.config           (ported from the 16.0-pipa kernel)
# Kernel builds are memory-light, so unlike a full ROM build this runs on a
# free runner. Catches: driver API drift, dts errors, Kconfig/Makefile hooks.

on:
  workflow_dispatch:
  push:
    branches: ["17.0"]
    paths:
      - ".github/workflows/kernel17-check.yml"

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + kernel deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev make cpio kmod rsync git \
            gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Clone pipa kernel (17.0-pipa)
        run: |
          git clone --depth=1 -q -b 17.0-pipa https://github.com/gohanparker/android_kernel_xiaomi_sm8250 kernel
          echo "pipa files: $(find kernel -iname '*pipa*' | wc -l)"

      - name: Merge configs + build Image/dtb
        run: |
          set -o pipefail
          cd kernel
          OUT=/tmp/kout; mkdir -p "$OUT"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          # Full config chain exactly as the ROM builds it:
          #   base = vendor/kona-perf_defconfig (from sm8250-common BoardConfigCommon.mk)
          #   + debugfs, sm8250-common, pipa fragments
          KB=arch/arm64/configs
          echo "=== merge base + fragments ==="
          scripts/kconfig/merge_config.sh -m -O "$OUT" \
            "$KB/vendor/kona-perf_defconfig" \
            "$KB/vendor/debugfs.config" \
            "$KB/vendor/xiaomi/sm8250-common.config" \
            "$KB/vendor/xiaomi/pipa.config" \
            "$KB/vendor/xiaomi/pipa-perf.config" 2>&1 | tee /tmp/kcfg.log | tail -n 12
          echo "=== olddefconfig ==="
          make O="$OUT" ARCH=arm64 olddefconfig 2>&1 | tail -n 5
          echo "=== pipa/platform config sanity ==="
          grep -E "CONFIG_MACH_XIAOMI_PIPA|CONFIG_QPNP_SMB5_PIPA|CONFIG_QPNP_FG_GEN4_PIPA|CONFIG_BQ2597X_CHARGE_PUMP_PIPA|CONFIG_ONEWIRE_GPIO_PIPA|CONFIG_BATT_VERIFY_BY_DS28E16_PIPA|CONFIG_ARCH_KONA=|CONFIG_BUILD_ARM64_DT_OVERLAY|CONFIG_COMPAT=" "$OUT/.config"
          echo "--- performance profile in effect:"
          grep -E "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=|CONFIG_CC_OPTIMIZE_FOR_SIZE=|CONFIG_INIT_ON_ALLOC|CONFIG_INIT_ON_FREE|CONFIG_DEFAULT_IOSCHED=|CONFIG_MQ_IOSCHED_KYBER=|CONFIG_ARM64_USE_LSE_ATOMICS=|CONFIG_CPU_BOOST=|CONFIG_MSM_PERFORMANCE=|CONFIG_SCHED_WALT=|CONFIG_PREEMPT=" "$OUT/.config"
          # Linux 4.19 vs modern GCC: needs -fcommon (GCC>=10 default) and the
          # kernel's warnings-as-errors relaxed. Our ported code is still fully
          # compiled - only warning severity changes.
          export KCFLAGS="-fcommon -Wno-error"
          echo "=== prepare (generated headers/host tools) ==="
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare 2>&1 | tail -n 5
          echo "=== compile ONLY the ported pipa objects (fast port feedback) ==="
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
            drivers/power/supply/maxim_pipa/onewire_gpio_master.o \
            drivers/power/supply/maxim_pipa/onewire_gpio_slave.o \
            drivers/power/supply/maxim_pipa/ds28e16_master.o \
            drivers/power/supply/maxim_pipa/ds28e16_slave.o \
            drivers/power/supply/maxim_pipa/ucl_sha3.o \
            drivers/power/supply/maxim_pipa/sha384_software.o \
            drivers/power/supply/qcom/qpnp-smb5-pipa.o \
            drivers/power/supply/qcom/smb5-lib-pipa.o \
            drivers/power/supply/qcom/step-chg-jeita-pipa.o \
            drivers/power/supply/qcom/qpnp-fg-gen4-pipa.o \
            drivers/power/supply/ti/pd_policy_manager_pipa.o \
            drivers/power/supply/ti/cp_qc30_pipa.o \
            drivers/power/supply/ti/bq2597x_charger_pipa.o \
            2>&1 | tee /tmp/kpipa.log | tail -n 25
          echo "ported objects built: $(ls $OUT/drivers/power/supply/maxim_pipa/*.o $OUT/drivers/power/supply/qcom/*pipa.o $OUT/drivers/power/supply/ti/*pipa.o 2>/dev/null | wc -l)"
          echo "=== dtbs (validates the ported pipa DTS + dtbo Makefile hook) ==="
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" dtbs 2>&1 | tee /tmp/kbuild.log | tail -n 15
          ls -la "$OUT/arch/arm64/boot/dts/vendor/qcom/" | grep -i pipa || echo "!! no pipa dtbo produced"
          echo "=== Image (validates the ported drivers compile) ==="
          make O="$OUT" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image 2>&1 | tee -a /tmp/kbuild.log | tail -n 25
          ls -la "$OUT/arch/arm64/boot/Image"
          echo "=== did our ported objects compile? ==="
          grep -cE "qpnp-smb5-pipa|smb5-lib-pipa|pd_policy_manager_pipa|bq2597x_charger_pipa|maxim_pipa|qpnp-fg-gen4-pipa|step-chg-jeita-pipa|cp_qc30_pipa" /tmp/kbuild.log

      - name: Collect logs (always)
        if: always()
        run: |
          cp /tmp/kcfg.log "$GITHUB_WORKSPACE/kcfg.log" 2>/dev/null || true
          cp /tmp/kbuild.log "$GITHUB_WORKSPACE/kbuild.log" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE" | head -n 12

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel17-logs
          path: |
            kcfg.log
            kbuild.log
          if-no-files-found: ignore
