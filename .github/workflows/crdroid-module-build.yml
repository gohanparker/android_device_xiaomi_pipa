name: crdroid-pipa-build

on:
  workflow_dispatch:
  push:
    branches: ["16.0"]
    paths: [".github/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Maximize disk + create swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/swift
          sudo docker image prune -af 2>/dev/null || true
          (sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile) || echo "runner swap already active - keeping it"
          df -h /

      - name: Checkout workflow repo (scripts)
        uses: actions/checkout@v4
        with:
          path: gh-script

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison ccache curl flex git git-lfs gnupg gperf rsync squashfs-tools unzip zip libelf-dev libssl-dev libxml2-utils zlib1g-dev libncurses-dev
          sudo curl -sL -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+rx /usr/local/bin/repo
          git lfs install
          git config --global user.name "gha"
          git config --global user.email "gha@users.noreply.github.com"

      - name: Init manifests (repo init only - no project sync)
        run: |
          mkdir -p "$HOME/romwork"
          cd "$HOME/romwork"
          repo init -u https://github.com/crdroidandroid/android.git -b 16.0 --depth=1 2>&1 | tail -n 2

      - name: Sync tree (plain clones, tree-only)
        run: |
          cd "$HOME/romwork"
          set -o pipefail
          python3 "$GITHUB_WORKSPACE/gh-script/.github/scripts/gha_sync.py" --root "$PWD" -j 4 2>&1 | tee /tmp/sync.log
          tail -n 8 /tmp/sync.log
          df -h /

      - name: Build CleanRamTile (two-phase analyse then compile)
        id: build
        run: |
          cd "$HOME/romwork"
          source build/envsetup.sh >/dev/null
          lunch lineage_pipa-bp4a-userdebug
          set -o pipefail

          echo "--- phase 1: soong analysis (needs the full tree) ---"
          df -h / | tail -n 1
          m --skip-ninja CleanRamTile 2>&1 | tee /tmp/analysis.log | tail -n 30
          COMBINED="$(ls out/combined*.ninja 2>/dev/null | head -n 1)"
          echo "combined ninja: $COMBINED"

          echo "--- phase 2: free disk (unused by a single app module) ---"
          rm -rf cts test platform_testing pdk developers device/google device/generic \
                 device/sample packages/apps/Car prebuilts/android-emulator \
                 hardware/qcom-caf/msm8953 hardware/qcom-caf/msm8996 hardware/qcom-caf/msm8998 \
                 hardware/qcom-caf/sdm660 hardware/qcom-caf/sdm845 hardware/qcom-caf/sm8150 \
                 hardware/qcom-caf/sm8350 hardware/qcom-caf/sm8450 hardware/qcom-caf/sm8450-6.6 \
                 hardware/qcom-caf/sm8550 hardware/qcom-caf/sm8650 hardware/qcom-caf/sm8750
          df -h / | tail -n 1

          echo "--- phase 3: compile with ninja (no re-analysis) ---"
          prebuilts/build-tools/linux-x86/bin/ninja -f "$COMBINED" -j3 CleanRamTile 2>&1 | tee /tmp/build.log | tail -n 40
          echo "--- disk/mem after build:"
          df -h / | tail -n 1; free -h | head -n 2

          APK="$(find out -name 'CleanRamTile.apk' -print | head -n 1)"
          if [ -z "$APK" ]; then echo "APK not found in out/"; exit 1; fi
          cp "$APK" "$GITHUB_WORKSPACE/CleanRamTile.apk"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Collect logs (always)
        if: always()
        run: |
          cp /tmp/analysis.log "$GITHUB_WORKSPACE/analysis.log" 2>/dev/null || true
          cp /tmp/build.log "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
          cp /tmp/sync.log "$GITHUB_WORKSPACE/sync.log" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE" | head -n 15
          df -h / | tail -n 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanRamTile
          path: |
            CleanRamTile.apk
            analysis.log
            build.log
            sync.log
          if-no-files-found: ignore
